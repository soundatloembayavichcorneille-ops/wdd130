<!DOCTYPE html>
<html lang="en-US">
<!-- Test commit -->


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="contact congo rapids rafting company for questions about rafting trips, reservation, and services.">
    <meta name="author" content="Soundat Loemba Yavich Corneille">
    <title>Contat Us | Congo Rapids Rafting</title>
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>

        <img src="images/z-rapids-trees.webp" alt="Congo Rapids Rafting logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <section class="contact-section">
            <div class="contact-text">
                <h2>White Water Rafting Company</h2>
                <p> 125 bella street</p>
                <p>Madibou, Brazzaville</p>
                <p>+242 06 746 11 84</p>
                <p>info@Congorapids.com</p>

            </div>

            <div class="contact-grid">
                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1018847.2008588371!2d14.344453765625003!3d-4.046552800000002!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2scg!4v1790601074174!5m2!1sfr!2scg"
                      width="400" height="450" allowfullscreen="" loading="lazy"
                      referrerpolicy="strict-origin-when-cross-origin"></iframe>

                </div>

                <form class="contact-form">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>


                    <fieldset class="message-purpose">
                        <legend>Message Purpose:</legend>
                        <label><input type="radio" name="purpose" value="general">General
                            Inquiry</label>
                        <label><input type="radio" name="purpose" value="reservation">Reservation
                            Question</label>
                        <label><input type="radio" name="purpose" value="suggestion">Website
                            Suggestion</label>
                    </fieldset>

                    <label for="message">Message</label>
                    <textarea id="message" name="messager"></textarea>

                    <label><input type="checkbox" name="newsletter"> Please suscribe me to the
                        monthly
                        newsletter</label>
                    <button type="submit">Get in Touch!</button>


                </form>

            </div>


        </section>


        <section class="adventures">

            <h2>We Are Here to Serve You </h2>


            <figure>
                <img src="images/employe1.webp" alt="John Smith, river guide">
                <figcaption>John Smith - River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employe2.webp" alt=" edward johnson, operations manager">
                <figcaption>edward johnson - operations manager</figcaption>
            </figure>

            <figure>
                <img src="images/employe3.webp" alt="Micheal Brown, safty director">
                <figcaption>Micheal Brown - safty director</figcaption>
            </figure>

        </section>

    </main>

    <footer>

        <div class="footer-banner">
            <p>© 2026 🌊 Congo Rapids Rafting 🌊 SOUNDAT Yavich</p>
            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.webp" alt="Facebook Icon">
                </a>
                <a href="https://linkedin.com">
                    <img src="images/linkedin.webp" alt="LinkedIn Icon">
                </a>
                <a href="https://instagram.com">
                    <img src="images/social.webp" alt="Instagram Icon">
                </a>
            </nav>

        </div>


    </footer>

</body>

</html>
